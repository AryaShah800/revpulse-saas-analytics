[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "revpulse"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4", "numpy>=2,<3", "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2", "matplotlib>=3.9,<4", "seaborn>=0.13,<1",
  "psycopg[binary]>=3.2,<4", "joblib>=1.4,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jsonschema>=4,<5"]
[project.scripts]
revpulse = "revpulse.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
