name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revpulse
          POSTGRES_PASSWORD: revpulse_ci
          POSTGRES_DB: revpulse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U revpulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Write test database config
        run: |
          mkdir -p .local
          echo '{"host":"127.0.0.1","port":5432,"dbname":"revpulse","user":"revpulse","password":"revpulse_ci"}' > .local/database.json
      - run: python -m pytest tests -q
